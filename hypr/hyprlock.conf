source = /home/anon/.config/hypr/wallpaper.conf


$text = rgb(143, 143, 143)
$font = JetBrainsMono Nerd Font
$base = rgb(0, 0, 0)
$accent = rgb(0, 50, 200)
$surface0 = rgb(50, 50, 50)
%red = rgb(200, 50, 50)

# GENERAL
general {
  no_fade_in = true
  no_fade_out = true
  hide_cursor = true
  grace = 0
  disable_loading_bar = true
}

# BACKGROUND
background {
  monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 2
    noise = 0.04
    contrast = 1
    brightness = 0.5
}

# LAYOUT
label {
  monitor =
  text = Layout: $LAYOUT
  color = $text
  font_size = 25
  font_family = $font
  position = 30, -30
  halign = left
  valign = top
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

# Input field
input-field {
    monitor =
    size = 600, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(200, 200, 200)
    inner_color = rgba(0, 0, 0, 0.2)
    font_family = JetBrains Mono SemiBold
    font_color = rgba(200,200,200,0.75)
    fade_on_empty = false
    rounding = -1
    check_color = rgba(0, 0, 0, 0.4)
    fail_color = rgba(0, 0, 0, 0.4)
    fail_text = Wrong password
    placeholder_text = Password
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}